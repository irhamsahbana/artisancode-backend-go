<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace Invitation</title>
</head>
<body style="margin:0;background:#eef6f3;font-family:Arial,sans-serif;color:#0f172a;">
  <div style="max-width:640px;margin:0 auto;padding:32px 20px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#0f6e56;border-radius:28px;padding:0;box-shadow:0 18px 45px rgba(15,23,42,0.12);">
      <tr>
        <td style="padding:28px 32px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td style="vertical-align:top;padding-right:14px;">
                <img src="{{ .LogoURL }}" alt="{{ .AppName }} logo" width="56" height="56" style="display:block;width:56px;height:56px;border:0;border-radius:16px;">
              </td>
              <td style="vertical-align:middle;">
                <p style="margin:0;font-size:12px;line-height:16px;letter-spacing:0.16em;text-transform:uppercase;color:#c7e8dd;">
                  {{ .Eyebrow }}
                </p>
                <p style="margin:6px 0 0;font-size:24px;line-height:28px;font-weight:300;letter-spacing:0.04em;color:#ffffff;">
                  pres<span style="font-weight:700;color:#9fe1cb;">en</span>se
                </p>
                <p style="margin:6px 0 0;font-size:12px;line-height:16px;color:#c7e8dd;">
                  <span style="color:#c7e8dd;">{{ .AppSignaturePrefix }}</span>
                  <a href="{{ .AppSignatureURL }}" style="color:#9fe1cb;text-decoration:none;font-weight:700;">{{ .AppSignatureLabel }}</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>

    <div style="background:#ffffff;border-radius:24px;margin-top:-18px;padding:40px 32px;box-shadow:0 18px 45px rgba(15,23,42,0.08);">
      <p style="margin:0 0 12px;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#64748b;">
        {{ .Eyebrow }}
      </p>
      <h1 style="margin:0 0 16px;font-size:32px;line-height:1.2;color:#0f172a;">
        {{ .Title }}
      </h1>
      <p style="margin:0 0 12px;font-size:16px;line-height:1.7;color:#334155;">
        {{ .Greeting }}
      </p>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.7;color:#334155;">
        {{ .Body }}
      </p>
      <a href="{{ .ActionLink }}" style="display:inline-block;border-radius:999px;background:#0f6e56;padding:14px 22px;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;">
        {{ .ActionLabel }}
      </a>
      <p style="margin:24px 0 0;font-size:14px;line-height:1.7;color:#64748b;">
        {{ .ExpiryLabel }}
      </p>
      <p style="margin:12px 0 0;font-size:14px;line-height:1.7;color:#64748b;">
        {{ .HelpText }}
      </p>
      <div style="margin-top:28px;border-top:1px solid #dbe7e2;padding-top:20px;">
        <p style="margin:0;font-size:13px;line-height:1.8;color:#64748b;">
          {{ .SupportLabel }}
          <a href="mailto:{{ .SupportEmail }}" style="color:#0f6e56;text-decoration:none;font-weight:600;">{{ .SupportEmail }}</a>
          &nbsp;|&nbsp;
          <a href="{{ .AppWebsiteURL }}" style="color:#0f6e56;text-decoration:none;font-weight:600;">{{ .AppWebsiteURL }}</a>
        </p>
        <p style="margin:10px 0 0;font-size:12px;line-height:1.7;color:#94a3b8;">
          {{ .FooterNote }}
        </p>
      </div>
    </div>
  </div>
</body>
</html>
